spring.application.name=QuiLaCarne_API
# Web Adress
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:5173}
# JWT Configuration
application.security.jwt.secret-key=${API_JWT_SECRET_KEY:mySecretKeyForJwtTokenGenerationPleaseChangeInProduction123456789}
application.security.jwt.expiration=${API_JWT_EXPIRATION:86400000}
# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/restaurant
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${API_SHOW_SQL:false}
# Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379
# Mail Configuration
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=
spring.mail.password=
spring.mail.properties.smtp.auth=false
spring.mail.properties.smtp.starttls.enable=false
# Logging Configuration
spring.jpa.properties.hibernate.format_sql=${API_FORMAT_SQL:false}
logging.level.com.example.restaurant=${API_LOGGING_LEVEL:DEBUG}
# Google OAuth2
application.security.google.client-id=${GOOGLE_CLIENT_ID:}
# S3
application.storage.s3.endpoint=${S3_ENDPOINT}
application.storage.s3.public-endpoint=${S3_PUBLIC_ENDPOINT:http://localhost:9000}
application.storage.s3.region=${S3_REGION}
application.storage.s3.access-key=${S3_ACCESS_KEY}
application.storage.s3.secret-key=${S3_SECRET_KEY}
application.storage.s3.bucket-name=${S3_BUCKET_NAME}